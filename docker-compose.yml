version: "3.9"

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODEL=base
      - APP_ENV=development
    volumes:
      - .:/app
      - audio_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python -m arq app.workers.transcription_worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WHISPER_MODEL=base
    volumes:
      - .:/app
      - audio_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  audio_storage:
